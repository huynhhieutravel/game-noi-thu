<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Gallery 30 Cổ Vật Thần Khí</title>
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 30px;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #00f5d4;
      font-size: 28px;
      margin-bottom: 8px;
    }
    p.sub {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #00f5d4;
    }
    .img-box {
      width: 140px;
      height: 140px;
      margin: 0 auto 12px auto;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0.6) 70%);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    img {
      max-width: 125px;
      max-height: 125px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }
    .name {
      font-weight: bold;
      font-size: 14px;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .id {
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>Gallery 30 Cổ Vật Thần Khí (Companion Relics)</h1>
  <p class="sub">Đã cắt chính xác, tách nền RGBA và tối ưu chuẩn 512x512</p>
  <div class="grid" id="galleryGrid"></div>

  <script>
    fetch('/src/data/relics.json?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = data.map(r => `
          <div class="card">
            <div class="img-box">
              <img src="/${r.image}?v=1" alt="${r.name}" />
            </div>
            <div class="name">${r.icon} ${r.name}</div>
            <div class="id">${r.id}</div>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
