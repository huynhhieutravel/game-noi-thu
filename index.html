<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Onet Linh Thú - Nối Thú Cổ Điển (Yokai & Thần Thoại)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0d0f17;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        position: fixed;
        inset: 0;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0f17;
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Rotate Device Overlay for Portrait mode */
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: radial-gradient(circle at 50% 35%, #1d192b 0%, #0a0b12 100%);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
        padding: 32px 24px;
        backdrop-filter: blur(14px);
      }

      @media (orientation: portrait), (max-aspect-ratio: 1/1) {
        #rotate-overlay {
          display: flex;
        }
      }

      .phone-icon-anim {
        width: 64px;
        height: 104px;
        border: 4px solid #00f5d4;
        border-radius: 14px;
        margin-bottom: 24px;
        position: relative;
        animation: rotatePhone 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 30px rgba(0, 245, 212, 0.45);
      }

      .phone-icon-anim::after {
        content: '';
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00f5d4;
      }

      @keyframes rotatePhone {
        0%, 15% {
          transform: rotate(0deg);
        }
        50%, 75% {
          transform: rotate(90deg);
        }
        90%, 100% {
          transform: rotate(0deg);
        }
      }

      .rotate-badge {
        display: inline-block;
        background: rgba(255, 215, 0, 0.15);
        color: #ffd700;
        border: 1px solid rgba(255, 215, 0, 0.4);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 12px;
        letter-spacing: 0.5px;
      }

      .rotate-title {
        font-size: 19px;
        font-weight: 900;
        margin-bottom: 10px;
        color: #f8f9fa;
        line-height: 1.3;
      }

      .rotate-desc {
        font-size: 13px;
        color: #adb5bd;
        max-width: 300px;
        line-height: 1.6;
      }

    </style>
  </head>
  <body>
    <!-- Rotate device overlay when held in portrait -->
    <div id="rotate-overlay">
      <div class="phone-icon-anim"></div>
      <div class="rotate-badge">📱 MÀN HÌNH NGANG CHUẨN NATIVE</div>
      <div class="rotate-title">Vui Lòng Xoay Ngang Điện Thoại</div>
      <div class="rotate-desc">Yokai Onet được thiết kế dạng màn hình ngang để có góc nhìn rộng, nối linh thú chuẩn xác nhất!</div>
    </div>

    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
